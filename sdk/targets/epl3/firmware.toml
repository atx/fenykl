# Callbacks: signatures the firmware enters plugin code with (sdk/README.md, Callbacks and slots).
# FENYKL_CALLBACK(<name>, fn) gives a C function a reverse entry stub for it; fw_call_<name>(addr, ...)
# calls a firmware function pointer with it. Fields:
#   entry     "calls" (through a pointer: the callee saves and allocates itself), or "call" with
#             saves and frame as for functions (the caller's CALL carries the callee's operands)
#   evidence, returns, args, note as for functions; only 32-bit scalars, no "..."
#
# Slots: aligned pointer words the firmware calls through (FENYKL_SLOT_REPLACE). Fields:
#   address   run address of the word
#   callback  the signature the firmware calls it with (a [callbacks.<name>] table)
#   expected  its stock value when a plugin runs, also the original that fw_orig_<slot> calls
#             (0 = empty slot, no original); the runtime refuses to touch any other value
#   cpu1, cpu1_evidence, note as for hooks (note: where the calls through the word were read)
#
# Vtables: stock tables a plugin may clone for one object (fenykl_vtable_attach). Fields:
#   address, count (slots, all of them: the whole table is copied), cpu1, cpu1_evidence, note.
#   A slot whose address lies in a vtable is one of its methods (FENYKL_VTABLE_SET).

