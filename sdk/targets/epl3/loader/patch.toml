# E-PL3 fenykl-loader patch: the pinned bytes of
# loader.S linked with loader.ld (disassembly: loader.lst), so that flashing never depends on the local
# toolchain. tests/test_fenykl_loader.py re-assembles the source and requires exactly these bytes.
# Addresses are run addresses; the block's load address is target.toml [stock] load_addresses.
# original_sha256 is the sha256 of the stock bytes each edit overwrites, checked before patching.
description = "Load and run C:\\FENYKL.BIN from the SD card at boot"

# usr1_task: call OlyTaskSelfEnd,[],8 -> call fenykl_spawn,[d2,d3,a2,a3],0x20
[[edit]]
