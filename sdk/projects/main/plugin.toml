targets = ["epl3", "em10ii"]

# HUD elements are drawn from a cw_updateDisplay hook (sdk/docs/hud.md). Its CPU1 scope rests on
# static analysis only; the library counts CPU1 calls and main stops drawing at the first one.
[capabilities.hud]
sources = ["main_hooks.c"]
hooks = ["cw_updateDisplay"]
cpu1_unproven = ["cw_updateDisplay"]

# The Fn override needs the key layer.
[capabilities.key]
sources = ["main_fn.c"]

# Features built only for targets with the body capability they read (include/body.h).
[capabilities.lens]
sources = ["feat_focus.c", "feat_dof.c"]

[capabilities.afc]
sources = ["feat_fmeter.c"]

[capabilities.batt]
sources = ["feat_batt.c"]

[capabilities.shot]
sources = ["act_shot.c"]

# The R/B swap and peaking hook img_exec (main_img_hook.c). It reaches CPU1 only through IMG_CALLIMG,
# which has no client in v1.6; the hook passes CPU1 passes through unchanged and counts them.
[capabilities.img_exec]
sources = ["main_img_hook.c", "main_rbswap.c", "main_rbswap_hook.c"]
hooks = ["img_exec"]
cpu1_unproven = ["img_exec"]

# Peaking (main_peak.c) follows a live-view pass in the img_exec hook with a line pass, whose shadow
# the img_hw_start hook patches; both pass CPU1 calls through untouched.
[capabilities.peak]
sources = ["main_peak.c", "main_peak_mark.c"]
hooks = ["img_hw_start"]
cpu1_unproven = ["img_hw_start"]
