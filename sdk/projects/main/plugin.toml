targets = ["em10ii"]

# The HUD needs no hook: its elements are GUI widgets (the library's slots).

# The Button Function entry (the screenshot in the stock function pickers).
[capabilities.fnfunc]
sources = ["main_fn.c"]

# Features built only for targets with the body capability they read (include/body.h).
[capabilities.lens]
sources = ["feat_focus.c", "feat_dof.c"]

[capabilities.afc]
sources = ["feat_fmeter.c"]

[capabilities.batt]
sources = ["feat_batt.c"]

[capabilities.precap]
sources = ["feat_precap.c"]

[capabilities.shot]
sources = ["act_shot.c"]

# The R/B swap: no hook, the colour-matrix bases repointed to swapped copies.
[capabilities.wb_base]
sources = ["main_rbswap_wb.c", "main_rbswap_base.c"]
