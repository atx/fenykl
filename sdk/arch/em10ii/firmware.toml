# Data: firmware addresses the SDK and its plugins use as values (sdk/README.md, Firmware data).
# `[data.<name>]` becomes `#define FW_<NAME> 0x...u` in fenykl_fw.h. Fields:
#   address   the address (RAM, table, MMIO register or the bound of an address range)
#   type      what lives there ("u8", "u32", "u8 []", "bound" for a range limit)
#   evidence  high or medium, as for functions
#   note      meaning and where it was read
# Layouts behind the address stay C structs or offsets in the code that reads them.

# --- address map ---
# Unlike the E-PL3, the code image sits at the bottom of DRAM and the firmware's RAM (variables,
# pools, bss, kernel stacks, OSD and image buffers) lies above it.

[data.dram_start]
address = 0x60000000
type = "bound"
evidence = "high"
note = "start of cached DRAM (uncached alias 0xA0000000; alias rule (a & 0x3FFFFFFF) | 0x80000000 in to_uncached 0x6007F686); only exception scratch 0x60000008..0x60000013 lies below image_start"

[data.image_start]
address = 0x60021000
type = "bound"
evidence = "high"
note = "start of the firmware code image: the .BIN block head copy (0x60021000..0x60021020), then boot0 from 0x60021020"

[data.image_end]
address = 0x610F2000
type = "bound"
evidence = "high"
note = "end of sec6, the last loaded code section; firmware RAM (.data0 0x61150FE0, pools 0x61153FC0.., bss up to 0x61DB6C00, uncached buffers 0xA2000000..0xBFFFFFFF) follows. The image has never-loaded gaps (0x60128800.., 0x601C9000.., 0x603D8000.., 0x60662000.., 0x60DA5000.., 0x60F8A800..)"

[data.dram_end]
address = 0x80000000
type = "bound"
evidence = "medium"
note = "end of the cached DRAM window: to_uncached/to_cached accept 0x60000000..0x7FFFFFFF and buffers reach 0xBFFxxxxx (0xBFABE600 at 0x60074958); installed DRAM size not proven"

[data.sec6_start]
address = 0x61010000
type = "bound"
evidence = "high"
note = "run address of sec6 (section table 0x60026CD0; sec6 0x61010000..0x610F2000). After section_wait(5) the section-load guard covers [0x61010000, 0x61104000) until section_wait(6) moves it to run(7) = 0x61100000; bit 5 of section_loaded marks that"

[data.main_code_start]
address = 0x60021020
type = "bound"
evidence = "high"
note = "first byte of main-code-01 (boot0 at its run address); together with main_code_end a superset of all code and rodata sections boot0..sec6"

[data.main_code_end]
address = 0x610F2000
type = "bound"
evidence = "high"
note = "end of sec6. The range includes never-loaded gaps and sections loaded on demand: before Usr0/Usr1/Usr4 have run, sec1..sec6 hold no firmware text yet"

# --- kernel, console, timer ---

[data.core_id]
address = 0x8050
type = "u32"
evidence = "high"
note = "core id of the executing core: 0 CPU0, 1 CPU1, 2 CPU2 (abs16 per-core register; read by dbg_puts 0x6002306D and dcache_flush_all 0x6007F5B5)"

[data.chctr]
address = 0x8070
type = "u16 MMIO"
evidence = "high"
note = "CHCTR, the executing core's cache control (abs16 per-core register, 16-bit accesses): ICEN 1, DCEN 2, DCBUSY 8, ICINV 0x10, DCINV 0x20 [verified: reset 0x600210F9 or 3; CPU1/CPU2 entries 0x60026F7F/0x6002743B write 0x30 then 3; dcache_flush_all 0x6007F57D..0x6007F638: and 0xfffd, btst 8 loop, or 0x20, or 2]. ICBUSY 4 is inferred: no stock code of this body reads it; the E-PL3 cache driver 0x6E634C2E returns CHCTR & 4 (I) or & 8 (D)"

[data.timer_now]
address = 0x98900074
type = "u32 MMIO"
evidence = "medium"
note = "free-running 30-bit down counter: freerun_count 0x60022F11 returns 0x3FFFFFFF - (0x98900074). 1 MHz (1000 counts per tick) is inferred from the timer setup, not measured; one MMIO block for all cores"

[data.uart_tee_buf]
address = 0xA1BB309C
type = "u8 []"
evidence = "high"
note = "uart_putchar 0x6006D171's capture buffer (uncached): stores each character at 0xA1BB309C[count] while uart_tee_state1 < 2 and count < 0x2FF (767 bytes)"

[data.uart_tee_count]
address = 0x8FF00084
type = "u16"
evidence = "high"
note = "bytes in uart_tee_buf, incremented by uart_putchar 0x6006D1A5, zeroed by the console init 0x6006CFD8; 0x6006D13B copies it to the per-channel replay counts 0x8FF00080 + 2 * channel"

[data.uart_tee_state1]
address = 0x8FF0007E
type = "u8"
evidence = "high"
note = "uart_state[1] (states at 0x8FF0007D + channel): capture runs only while it is < 2. The console init 0x6006CFD1 sets it to 3 and main-code-01 only ever writes 2 or 3 (0x6006D15B, 0x6006D101), so the capture is never on in this firmware"

[data.poweron_factor]
address = 0xA1C17C14
type = "u32"
evidence = "medium"
note = "power-on factor word: power_on_factor_init 0x60181C84 (sec1, called from 0x6017F156) stores table 0x601A8D28 {0x1000001, 12, 0x100, 0x1506, 0x121C, 0x400, 0x1000003, 0x1000003, 0x1000002, 0x1000001} indexed by the wake index; read by power_on_factor_get 0x6017F586; 12 = normal power-on. Which value a USB-cable start gives is not established (0x400 is index 5 here, index 4 on the E-PL3)"

[data.section_loaded]
address = 0xA1C18044
type = "u8"
evidence = "high"
note = "loaded mask of the on-demand code sections: bit n-1 = section n. Only writer: section_wait 0x6004206F, `movbu d0,(0xA1C18044)` at 0x6004211D with d0 |= 1 << (pending - 1) (0x60042082..0x6004208D), after the section's guard and constructors; byte scan finds the absolute operand only there (0x60042117, 0x6004211F) and in the reader 0x60041F97 (section_loaded(n)). In the bss zeroed at reset. Test a section's bit before calling into it; never section_request a loaded section: 0x60041FAF then sets u8 0xA1C18045 = 1 and every later section_wait returns at 0x6004207F without waiting"

# --- card file I/O (fileif.c client wrappers, sec3) ---
# The wrappers run the file operation directly when called by the file task FILECLBK (task id 0x11 at
# 0x60040C52) and otherwise post it to FILECLBK's queue 0x22 (half word 0x60041030) through the
# synchronous RPC 0x6006D2DA (one reply queue created and deleted per call, infinite timeouts), so
# all callers' requests are served one at a time by FILECLBK. FILECLBK is started by the Usr3 stage
# and the code lives in sec3: callable only after Usr3 started FILECLBK. Paths are "<letter>:\NAME",
# drive = letter - 'C' (or - 'c'), drive 0 = the SD card; the stock code formats "%c:\%s".
# Errors set the file errno word 0x618A19E0 (0x9415 media not mounted, 0x9414 not found or not
# allowed, 0x9417 internal/context).

[rpc_fopen]
address = 0x60564829
saves = []
frame = 0x4
evidence = "high"
returns = "void *"
args = ["a const char *path", "a const char *mode"]
note = "sec3; ret [],4 at 0x6056482F, 49 CALLs [],4; body: clr d0 and call fopen_opt 0x6056570C,[d2,d3,a2,a3],44 (option 0); RPC cmd 0x10001 -> server 0x60570DC0. Returns A0 = FILE* or 0 (stock callers test A0, e.g. 0x60172615). Mode chars r (1), w (2), a (0xA), + (3), b, c, d (sector-direct reads into the caller's buffer), e, h; 'r' reads through a 0x4000 bounce buffer with memcpy, so any buffer works. Open on an unmounted drive fails at once with errno 0x9415 (media status bit 0x100 clear, no I/O); a write mode on a protected card fails with 0x9414"
cores = ["cpu0"]
cores_evidence = "verified: on CPU0 a non-FILECLBK task takes the RPC path (0x6056FBDF returns 1); other cores take a copy-to-heap RPC path (returns 2) that is not exercised by the SDK"

[rpc_fclose]
address = 0x60564832
saves = ["d2", "a2", "a3"]
frame = 0x10
evidence = "high"
returns = "int"
args = ["a void *fp"]
note = "sec3; ret [d2,a2,a3],16 at 0x605648AC, 65 CALLs [d2,a2,a3],0x10; RPC cmd 0x10002 -> 0x60571318; returns the server result, -1 on RPC/context error"
cores = ["cpu0"]
