# Firmware functions callable from plugins (OM-D E-M10 Mark II v1.4 main-code-01 run addresses).
# `fenykl plugin build` turns this into fenykl_fw.h (prototypes fw_<name>), assembly thunks and the
# address symbols. One table per function:
#
#   address   run address of the function
#   saves     register list of the CALL that enters it (subset of d2, d3, a2, a3)
#   frame     frame size of that CALL; saves and frame must equal the callee's own RET/RETF
#   evidence  confidence of the name/signature: high or medium
#   returns   C return type (ints come back in D0, pointers in A0 in both ABIs)
#   args      "<class> <C declaration>", class d = integer (D0, D1, then stack),
#             a = pointer (A0, A1, then stack); "..." last = variadic (the last named argument
#             goes to the first stack slot, 8 variadic words are forwarded)
#   note      where saves/frame/args were read, and the code section the function lives in
#   cores     optional, default ["cpu0"]: the cores that may call it, ["cpu0"] or ["cpu0", "cpu1"];
#             files in plugin.toml cpu1_sources
#             cannot call a CPU0-only function (compile error)
#   cores_evidence  with cores: what the classification rests on
#
# This body has three cores (core id 0, 1, 2); the SDK only builds for CPU0 and CPU1.
#
# Code sections: main-code-01 is not loaded in one piece. boot0 (0x60021020..0x60030000) and boot1
# (0x60030000..0x60128800, incl. boot1b) are loaded at reset and always callable. sec1
# (0x60130000..0x601C9000) is loaded on demand by the Usr0 boot stage, sec2 by Usr1, sec3 by Usr1/Usr2,
# sec4..sec6 (0x60673000..0x610F2000) by Usr4. A function in secN is callable only after that load;
# each note names the section.
#
# Only 32-bit arguments. Add a function only when its CALL encoding and argument registers have
# been read from the firmware; unknown signatures stay out.
#
# Hook targets: a `hook` table, fields as in epl3/firmware.toml (sdk/README.md, Hooks). On this body
# cpu1 = "unproven" covers CPU1 and CPU2, and such an entry must have its 5 patched bytes in one
# aligned 8-byte block (one I-cache line), so that a core with a stale line runs the stock entry
# (tests/test_fwapi.py checks it).
#
# Further down: data (addresses the SDK uses as values, FW_<NAME>).

[dbg_puts]
address = 0x6002306C
saves = ["a2"]
frame = 0x18
evidence = "high"
returns = "void"
args = ["a const char *s"]
note = "boot0; ret [a2],24 at 0x600230C6; all 3053 CALLs use [a2],24; string in A0 (mov a0,a2 first). A first byte 0xFF/0xFE does not print: it sets/clears the mute flag 0x615DC966 (1/0); while muted the text only goes to 0x60ECB501 (sec5) if (0x615DC968) != 0. CPU0 writes the text itself (0x600230C9: LF -> CR LF, uart_putchar 0x6006D171) under irq_lock(0)"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: (0x8050) != 0 at 0x6002306D: OlyQueueWrite 0x60069429 of {s, 0x80} to the CPU0 console queue (id at 0x60041282) with timeout -1, so from CPU1 a message is cut to 128 bytes and the call blocks until queued; in a CPU1 ISR the write fails (E_CTX) and 0x600230BB prints '!!!!!!!!!! 1' through the direct path instead"

[sprintf]
address = 0x60132595
saves = []
frame = 0xC
evidence = "high"
returns = "void"
args = ["a char *buf", "a const char *fmt", "..."]
note = "sec1 (callable after Usr0 loaded it); ret [],12 at 0x601325AD; all 2382 CALLs use [],12; buf in A0, fmt at (4,SP) (read as (0x10,sp) inside), varargs from (8,SP) passed as a pointer to the formatter 0x6013121D with mode 1; result not characterised"
cores = ["cpu0"]
cores_evidence = "CPU0 only: the formatter's call tree reaches the stdio stubs that print '[SC]call putc()' through the console writer 0x600230C9 (irq_lock, UART), so it is not shown to be pure"

[OlyTaskSleep]
address = 0x6006992F
saves = ["d2"]
frame = 0x8
evidence = "high"
returns = "int"
args = ["d int ticks"]
note = "boot1b; ret [d2],8 at 0x60069948; all 228 CALLs use [d2],8; D0 = ticks passed unchanged to dly_tsk 0x6003172B (wakes at the (n+1)-th tick); returns 0, or -1 when the kernel result is negative (E_CTX in an ISR or with dispatch disabled, E_PAR for n >= 0x7FFFFFFF). Tick = 1000 counts of the 0x98900000 timer, 1 ms inferred from the prescaler setup, not measured"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: dly_tsk acts on the calling core's own KCB; CPU1 has its own tick (timer ch2, IRQ 0x3B)"

[OlyTaskCreate]
address = 0x60069CAD
saves = ["d2", "d3", "a2", "a3"]
frame = 0x34
evidence = "high"
returns = "int"
args = [
    "a const char *name",
    "a fw_task_entry entry",
    "d int mode",
    "d int exinf",
    "d int priority",
    "d unsigned stack_size",
    "a void *stack_base",
]
note = "boot1b; ret [d2,d3,a2,a3],52 at 0x60069EC7; all 9 CALLs use [d2,d3,a2,a3],52. A0 name, A1 entry, D0 mode (2 = create and start), D1 exinf, priority as u16 at (0x38,sp) = caller (4,SP), stack size (0x3C,sp) = (8,SP), stack base (0x40,sp) = (12,SP) (0 = kernel heap). Priorities 8/9/10/11 are rewritten to 45/46/54/55 with a print; 1..128 valid. Returns task id or -1"
cores = ["cpu0"]
cores_evidence = "verified: the task is created on the calling core (acre_tsk on the own KCB, Oly task table 0xA1BE33D0 + core * 0x480 at 0x60069DC4); from CPU1 it would be a CPU1 task"

[malloc]
address = 0x600233DF
saves = []
frame = 0x4
evidence = "high"
returns = "void *"
args = ["d unsigned size"]
note = "boot0 scheap_alloc; ret [],4 at 0x6002341B; all 597 CALLs use [],4; size in D0, result in A0. Size classes <= 0x80, <= 0x800, <= 0x4000; size > 0x4000 prints 'scheap_alloc: Size Over :' and returns NULL (the limit is 0x4000, not 0x3FFC); behaviour on an exhausted class not read"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: 0x600235BF takes irq_lock(1) and the cross-core hwlock 0x0A09000A (spin) around the class allocator; task context (irq_lock disables dispatch there)"

[free]
address = 0x6002341E
saves = []
frame = 0x4
evidence = "high"
returns = "void"
args = ["a void *p"]
note = "boot0 scheap_free; ret [],4 at 0x60023478; all 617 CALLs use [],4; pointer in A0, pool chosen by address range (0x61153FC0.., 0x614B9000.., 0x6120A540..). A pointer outside the pools, NULL included, prints 'scheap_free: not allocated pointer :' and returns"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: 0x600235F2 takes irq_lock(1) and the cross-core hwlock 0x0A09000A, as malloc"

[get_tid]
address = 0x60031BE2
saves = ["a2"]
frame = 0x4
evidence = "high"
returns = "int"
args = ["a uint16_t *tid"]
note = "boot1 (kernel); retf [a2],4 at 0x60031C23; all 69 CALLs use [a2],4. Stores the u16 id of the executing core's running task (KCB 0x8FF00004 + 4 * core, current TCB at +0x60, id at TCB+0x10) to *A0 and returns 0; returns -0x19 (E_CTX) without storing when the KCB context bytes (+0x1C)[0] or [1] say interrupt or dispatch-disabled context"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: reads the executing core's own KCB by (0x8050); no lock, no store but *A0"

