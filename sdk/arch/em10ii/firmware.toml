note = "entry of a task made by acre_tsk: the kernel enters it with `calls (a2)`, D0 = exinf and SP 4 below the stack top (0x600329DD..0x600329E3). It must not return: end it with exd_tsk"

[exd_tsk]
address = 0x600319AA
saves = []
frame = 0x4
evidence = "high"
returns = "void"
args = []
note = "boot1 (kernel); `call 0x600318E2,[d2,d3,a2,a3],0x14; ret [],4` (RET at 0x600319AF, never reached); all 8 CALLs use [],4. Removes the running task, frees its stack when acre_tsk allocated it, clears the TCB id and dispatches. Does not return; task context only"
cores = ["cpu0", "cpu1"]
