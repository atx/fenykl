# ======================================================================================================
# --- CPU1 start: run a task on CPU1 ---
# Run code on CPU1: CPU0 posts a function with cpucall_post; CPU1's CPUCALL_CPU1 task (0x101C, priority
# 51, entry 0x60071DA7, 0x400 stack) runs it, and it creates a CPU1 task with the kernel's acre_tsk; the
# task ends with exd_tsk. The firmware's own Wi-Fi shell start 0x60E44557 does the same: on CPU1 it
# calls 0x60E445AE directly, else cpucall_post(0x60E445A9, 0, 1); 0x60E445AE calls acre_tsk with
# {TA_ACT, exinf 0, entry 0x60E44363, priority 0x37, stack 0x400, kernel heap}. Every CALL form below was
# counted by a byte scan of main-code-01 for call d16/d32 to the entry; each RET was read in the listing.

[cpucall_post]
address = 0x60071B71
saves = ["d2", "d3", "a2", "a3"]
frame = 0x28
evidence = "high"
returns = "int"
args = ["a void *func", "a void *arg", "d unsigned core"]
note = "boot1b; ret [d2,d3,a2,a3],0x28 at 0x60071C97 (its only RET); all 16 CALLs use [d2,d3,a2,a3],0x28. A0 func (0x60071B77), A1 arg (0x60071B79), D0 core as a byte (0x60071B71); core >= 3 prints an error. Own core: `calls (a1)` at once with A0 = arg (0x60071B9D..0x60071BA1). Else under dis_dsp the first free slot (func word 0) of the 32 of (target, source) gets {func, arg} (target 1 from CPU0: 0xA1BE74F0; 0x60071BD1..0x60071C2D), then cpucall_ring_post 0x6007179B queues {trampoline, source << 16 | slot} on the (source, target) ring (descriptor 0x6009D1F8 + target * 0x30 + source * 0x10 = {wp byte, rp byte, ring, IRQ 0x78 bit}; CPU0 -> CPU1: wp 0xA1BE6FD8, rp 0xA1BE6FD9, ring 0xA1BE6CD8, 32 entries, full when wp + 1 == rp mod 32) and raises the IRQ. Returns -1 only when all 32 slots are in use; a full ring prints '[CREQ]Buffer Full' and the post is lost with its slot held, yet 0 is returned (0x60071C8D..0x60071C93). The target's CPUCALL task runs `calls (a1)` with A0 = arg in task context, then frees the slot (CPU1: 0x60071E0E..0x60071E16). No result, no completion signal"

[acre_tsk]
address = 0x600306D3
saves = ["d2", "a2", "a3"]
frame = 0x14
evidence = "high"
returns = "int"
args = ["a const void *ctsk"]
note = "boot1 (kernel); ret [d2,a2,a3],0x14 at 0x600307DA (its only RET); all 21 CALLs use [d2,a2,a3],0x14. A0 -> T_CTSK of 6 words: atr (byte 0..3 checked, else E_RSATR -11; 2 = TA_ACT), exinf, entry, priority (u16, 1..128 else E_PAR -17), stack size (>= 0x14 else E_PAR), stack base (0 = the calling core's kernel heap, `(size + 0x17) & ~3` from 0x60036C44, E_NOMEM -33 on failure, then atr bit 0x80 marks the stack for exd_tsk to free: 0x60030CDE..0x60030D07). E_CTX -25 in an ISR or with the CPU locked. Copies T_CTSK to TCB+0x44 and with TA_ACT readies the task (0x60032654: frame at top - 0x14, entered through 0x600329DD with D0 = exinf by `calls`). Returns the new id (core in bits 12-14) or the error"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: the id, the TCB and the stack come from the executing core's KCB ((0x8FF00004)[(0x8050)]); CPU1 callers: cpuconn_scan 0x6006C3F9 in CPUCONN_CPU1 and the Wi-Fi shell start 0x60E445AE in CPUCALL_CPU1"

[exd_tsk]
address = 0x600319AA
saves = []
frame = 0x4
evidence = "high"
returns = "void"
args = []
note = "boot1 (kernel); `call 0x600318E2,[d2,d3,a2,a3],0x14; ret [],4` (RET at 0x600319AF, never reached); all 8 CALLs use [],4 (the cpu_conn workers 0x6006BF71/92/B3, five in sec5). 0x600318E2 (its only caller is this wrapper) takes the kernel lock, removes the running task, frees its stack through 0x60036D62 when atr bit 0x80 says the kernel allocated it, clears the TCB id (the id is free again), dispatches and calls kernel_fatal(-0x76) if that ever returns. Does not return; task context only"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: acts on the executing core's KCB ((0x8FF00004)[(0x8050)]); CPU1 callers: the cpu_conn worker for CPU0's packets 0x6006BF5B runs on CPU1 and CPU2"

# ======================================================================================================
# --- USB EP0: answer control requests from a hook on the dispatcher ---
# The EP0 control request dispatcher of the USB device stack (sec5) and its two reply helpers. All
# three run only in the USB core ISR (IRQ 0x51, level 5, CPU0) on the shared 4 KiB CPU0 interrupt
# stack. Read by hand in the v1.4 main code: every CALL operand, every RET, the argument registers,
# the span bytes, and a byte scan for branch/call targets and stored words inside the span.

[usb_ep0_request]
address = 0x60E6C98C
saves = ["d2", "d3", "a2", "a3"]
frame = 0x2C
evidence = "high"
returns = "void"
args = ["a void *setup"]
note = "sec5; both CALLs use [d2,d3,a2,a3],0x2c with A0 = 0x61A66C76, the 8-byte setup packet copy: 0x60E6C83F in usb_ep0_setup 0x60E6C7C3 (no data stage, or device-to-host) and 0x60E6C898 in usb_ep0_recv_next 0x60E6C847 (after the last OUT packet of a host-to-device data stage into 0x61A66B74, with the EP0 state u16 0x61A66B6C set to 0 first). Looks bRequest + 1 up in the 16-slot table 0x60F55550 {u32 key, u32 code} by linear probing (bmRequestType is not part of the key) and enters the handler with `jmp (a1)` inside its own frame; the handlers end `ret [d2,d3,a2,a3],0x2c` (0x60E6CA61, 0x60E6CA6A, 0x60E6CBDC, 0x60E6CDFA, 0x60E6CEA3), reply through usb_ep0_send or ack/stall through usb_ep0_finish, and use only (4..0x10,sp) of the frame. Neither caller reads D0 on return"

[usb_ep0_request.hook]
entry = "call"
relocate = "93 f8 47 01 a5 00"
cpu1 = "cpu0-only"
cpu1_evidence = "static: the only references are the two CALLs above, in usb_ep0_setup and usb_ep0_recv_next, which are called only from usb_ep0_event 0x60E6C76E in the USB core ISR chain (IRQ 0x51 on CPU0: usb_isr_core 0x60E6D096 -> usb_isr_dispatch 0x60E6D0B0); no stored word equals an address in the span. Not run on the camera"
note = "mov a0,a3; movbu (1,a3),d1; cmp 0,d1: instruction boundaries at +1 and +4 inside the 5 patched bytes, harmless here because the code runs only in the ISR and every nested ISR finishes before a task (the installer) runs again. The bge at +6 reads the flags of the relocated cmp; the trampoline's jmp back does not change PSW. Byte scan of main-code-01 for bcc/bra d8, bvc..bns d8, jmp/call d16/d32 and calls d16/d32: no target in 0x60E6C98D..0x60E6C991; no 32-bit word equals 0x60E6C98C..0x60E6C991 or its 0xA alias. The 5 bytes cross a 16-byte boundary (0x60E6C990): CPU0's I-cache invalidate covers it, no other core runs it"

[usb_ep0_send]
address = 0x60E6C8BD
saves = []
frame = 0x4
evidence = "high"
returns = "void"
args = ["a const void *buf", "d unsigned len"]
note = "sec5, EP0 ISR only; ret [],4 at 0x60E6C8E3 (only RET); its one CALL uses [],4: 0x60E6CBD7, the shared reply tail of the request handlers. Stores len (u16 0x61A66B6E) and buf (0x61A66B70), selects pipe 0, sets the EP0 state 0x61A66B6C to 1 and sends the first packet at once through 0x60E6C8E6 (64-byte packets; a short last packet returns the state and the remaining count to 0). The FIFO is written in 16-bit units, so buf must be 2-byte aligned. Not for plugins to call outside the EP0 hook"

[usb_ep0_finish]
