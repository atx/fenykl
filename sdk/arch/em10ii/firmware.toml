# --- keys and application events ---

[ui_key_get_state]
address = 0x6017F252
saves = ["d2", "d3", "a2"]
frame = 0x18
evidence = "high"
returns = "unsigned"
args = ["d unsigned code"]
note = "sec1; ret [d2,d3,a2],24 at 0x6017F32A; all 113 CALLs use [d2,d3,a2],24 (102 d32, 11 d16). D0 = key code, compared in full (0x60180DA9 compares all 32 bits). Returns 0 active (pressed, cable in) / 1 inactive / 0xFFFF code in no key table: the state reader 0x60180E0A returns (input bit != the map entry's active level). Mode dial: 0x1901 alone returns the level of one bit of the resistor ladder, not the dial; the full code 0x02021901 returns the dial value (0x6017F32D); 0x100 (half press) comes from the trigger state byte 0xA1C1801C. Overrides: 0x500/0x501 read 1 while 0x501/0x400 are 0; codes 2 and 0xC can be forced by settings 0x1F72/0x1FC2 (0x60180119). 0x400 UsbC (USB cable, 0 = cable in, as 0x602F0689 maps 0 to connected), 0x1506 MdaC (card detect: non-zero makes 0x60577601 report the card not ready). Reads key state bytes and tables only (0x60180DA6, 0x60180E0A, 0x6017F202) plus a settings read; safe from a CPU0 task"

[appevent_post]
address = 0x60042428
saves = ["d2", "d3", "a2"]
frame = 0x10
evidence = "high"
returns = "int"
args = ["d unsigned event", "d unsigned param", "a unsigned flag"]
note = "boot1 code that calls sec2 (0x602C9735, 0x602C95E5, 0x602C9836, 0x602C95AB): callable once sec2 is loaded. ret [d2,d3,a2],16 at 0x6004248F; all 52 CALLs use [d2,d3,a2],16, plus 114 through 0x6004241B (event, flag; param 0). No stored pointer to it. Drops the event unless the init byte 0xA1C184DA == 0x77; drops 0x040D00B5/B6 while 0x602CB5F2(0x5E4) != 0, and 0x04030020, 0x04125000; filters 0x602C9735 (0x02021710, 0x02022301), the key-combination stage 0x602C95E5 (may hold an event back and post it later through 0x602C95AB) and the duplicate filter 0x602C9836; then posts {u16 flag, event, param} (12 bytes) to the queue whose id is at 0x60040FF8 with no timeout. D0 on return is meaningless (no caller reads it)"

[appevent_post.hook]
entry = "call"
relocate = "83 f1 e6 fc a9 da 84 c1 a1"
cpu1 = "unproven"
cpu1_evidence = "static: reached on CPU1 through 0x6004241B by the Wi-Fi tasks WIFI_RELEASE_PUSH (0x60E3B068 posts 0x041B0029) and WIFI_REMOCON_CGI (0x60E3EC1D, event from the remote command); every key event comes from CPU0 (UI_IN, PWR_STANDBY, USRSTART_THIRD). Not run on the camera"
note = "mov d0,d3; mov d1,a2; movbu (0xA1C184DA),d1 (absolute). No call, jmp or branch into 0x60042429..0x60042430 and no stored pointer to 0x60042428..0x60042430 (cached or uncached alias) in main-code-01. Instruction boundaries at +1 and +3 lie inside the 5 patched bytes (a CPU0 task preempted there must not resume after a patch). 8-byte aligned entry: the patched bytes share one I-cache line"

