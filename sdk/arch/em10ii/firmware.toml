# type-7 cam_request; fcs (the FCS_MOVIE task's contrast AF) is the stock client. Every entry was read
# by hand in the v1.4 main code. Layouts (fenykl_body.h): request 0x88 bytes {+0 u16 type 7, +2 u8 1,
# +4 sensor info (0 = keep the driver's), +0x1C contrast_setting, +0x30/+0x34 0 = async path, +0x38
# done callback, +0x4C frame callback, +0x6C event mask}, written by fcs_af_eval_start
# 0x603F2F96..0x603F303D after cam_req_init 0x601C893C cleared 0x88 bytes (fcs leaves +4 at 0 except
# for its 0x3000 packet); contrast_setting 0x228 bytes {+0 u16 number (0xFFFF endless, 0 = detach at
# the next frame), +8 u32 update bits, +0x7C u16 vdiv, +0x8A u8 area_add, +0x8C cnt DMA, +0x90 fc
# DMA, parameters up to +0x18B, results from +0x18C}.

