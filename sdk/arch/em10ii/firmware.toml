# Run code on CPU1: CPU0 posts a function with cpucall_post; CPU1's CPUCALL_CPU1 task (0x101C, priority
# 51, entry 0x60071DA7, 0x400 stack) runs it, and it creates a CPU1 task with the kernel's acre_tsk; the
# task ends with exd_tsk. The firmware's own Wi-Fi shell start 0x60E44557 does the same: on CPU1 it
# calls 0x60E445AE directly, else cpucall_post(0x60E445A9, 0, 1); 0x60E445AE calls acre_tsk with
# {TA_ACT, exinf 0, entry 0x60E44363, priority 0x37, stack 0x400, kernel heap}.

[cpucall_post]
address = 0x60071B71
saves = ["d2", "d3", "a2", "a3"]
frame = 0x28
evidence = "high"
returns = "int"
args = ["a void *func", "a void *arg", "d unsigned core"]
note = "boot1b; ret [d2,d3,a2,a3],0x28 at 0x60071C97 (its only RET); all 16 CALLs use [d2,d3,a2,a3],0x28. A0 func (0x60071B77), A1 arg (0x60071B79), D0 core as a byte (0x60071B71); core >= 3 prints an error. Own core: `calls (a1)` at once with A0 = arg (0x60071B9D..0x60071BA1). Else under dis_dsp the first free slot (func word 0) of the 32 of (target, source) gets {func, arg} (target 1 from CPU0: 0xA1BE74F0; 0x60071BD1..0x60071C2D), then cpucall_ring_post 0x6007179B queues {trampoline, source << 16 | slot} on the (source, target) ring and raises the IRQ. Returns -1 only when all 32 slots are in use; a full ring prints '[CREQ]Buffer Full' and the post is lost with its slot held, yet 0 is returned (0x60071C8D..0x60071C93). The target's CPUCALL task runs func (cpucall_fn) in task context, then frees the slot (CPU1: 0x60071E0E..0x60071E16). No result, no completion signal"

[callbacks.cpucall_fn]
entry = "calls"
evidence = "high"
returns = "void"
args = ["a void *arg"]
note = "a function posted with cpucall_post: the target core's CPUCALL task enters it with `calls (a1)` and A0 = arg (CPU1: 0x60071E0E..0x60071E13), in task context; the result is ignored"

[acre_tsk]
address = 0x600306D3
saves = ["d2", "a2", "a3"]
frame = 0x14
evidence = "high"
returns = "int"
args = ["a const void *ctsk"]
note = "boot1 (kernel); ret [d2,a2,a3],0x14 at 0x600307DA (its only RET); all 21 CALLs use [d2,a2,a3],0x14. A0 -> T_CTSK of 6 words: atr (byte 0..3 checked, else E_RSATR -11; 2 = TA_ACT), exinf, entry (kernel_task), priority (u16, 1..128 else E_PAR -17), stack size (>= 0x14 else E_PAR), stack base (0 = the calling core's kernel heap, `(size + 0x17) & ~3` from 0x60036C44, E_NOMEM -33 on failure, then atr bit 0x80 marks the stack for exd_tsk to free: 0x60030CDE..0x60030D07). E_CTX -25 in an ISR or with the CPU locked. With TA_ACT readies the task. Returns the new id (core in bits 12-14) or the error"
cores = ["cpu0", "cpu1"]
cores_evidence = "verified: the id, the TCB and the stack come from the executing core's KCB ((0x8FF00004)[(0x8050)]); CPU1 callers: cpuconn_scan 0x6006C3F9 in CPUCONN_CPU1 and the Wi-Fi shell start 0x60E445AE in CPUCALL_CPU1"

[callbacks.kernel_task]
