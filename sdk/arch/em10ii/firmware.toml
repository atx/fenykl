# ======================================================================================================
# --- Still burst frame done: drop a burst frame before the record handoff ---
# The high-level sequence (CmpSqp_SequencePartsBase, HFW task HIGHLEVEL_MAIN) finishes each burst frame
# in its virtual "frame done" (vtable slot 0xD90). Read by hand in the v1.4 main code: the function
# body, every load of slot 0xD90 (byte-level disassembly), every RET, and word scans for stored
# pointers. Buffer manager (sequence +0x208): list heads at +0x114 + 4 * n, list 1 = frames requested
# and not yet done, oldest first; a buffer's u32 +0x38 & 0xF is its state (3 = in list 1).

[callbacks.seq_frame_done_cb]
entry = "calls"
evidence = "high"
returns = "unsigned"
args = ["a void *seq"]
note = "sequence frame done, vtable slot 0xD90. Entered with `calls (a1)` from two thunks that load the slot word at each call: 0x607FFE48 (slot 0x20D8 of every sequence vtable; A0 = the sequence), reached from the HFW event dispatcher case at 0x607AC561, which ignores D0 (mov 1,d0 at 0x607AC6A5); and 0x607A8CD4 (slot 0xE44 of the controller vtable 0x60B337E4; A0 = controller +0xB10). The stock 0x607E1CB0 (movm [d2,a2,a3]; add -0x14,sp .. ret [d2,a2,a3],0x20 at 0x607E1DFA, its only RET) uses A0 only: D0 is overwritten first (mov 0x4200,d0), D1/A1 are written before use, no stack argument. Unless flag word 0x615E451C & 0x4200, it calls the record handoff 0x607EACB5 (takes the list-1 head); then, by flags 0x8000 / 8 / 0x4000 / 0x100, counters and stop checks; frames in flight u16 0x615E4530 -= 1; slot 0x10E8(0x10008000); posts event 0x45CA through the queue (0x608EC964)"

