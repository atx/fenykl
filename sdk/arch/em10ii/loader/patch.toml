# E-M10 Mark II v1.4 fenykl-loader patch: the pinned bytes of
# loader.S linked with loader.ld (disassembly: loader.lst), so that flashing never depends on the local
# toolchain. tests/test_fenykl_loader.py re-assembles the source and requires exactly these bytes.
# Addresses are run addresses; the block's load address is target.toml [stock] load_addresses.
# original_sha256 is the sha256 of the stock bytes each edit overwrites, checked before patching.
description = "Load and run C:\\FENYKL.TST once (removed first) or C:\\FENYKL.BIN from the SD card at boot"

# Usr3 (USRSTART_THIRD): call task_self_end,[],8 -> call fenykl_spawn,[d2,d3,a2,a3],0x20
[[edit]]
block = "main-code-01"
address = 0x6018D73A
original_sha256 = "07b224fb7e431c4ba4f4e49cd427384d50923ba1263e6bf8adc0ec0f8dbe7565"
replacement = "dd c6 08 ed ff f0 20"

