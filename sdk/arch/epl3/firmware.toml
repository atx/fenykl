# Hook targets: a `hook` table makes the function hookable (sdk/README.md, Hooks). Fields:
#   entry          "call": entered by CALL with the operands above (the only supported kind)
#   relocate       the stock entry bytes, whole instructions, at least 5 (the jmp); they are checked
#                  against the stock image by the tests and against RAM before every install
#   cpu1           "cpu0-only" (with evidence that CPU1 never runs it) or "unproven"
#   cpu1_evidence  what the scope rests on
#   note           why the span is safe to relocate (no interior branch target, no stored pointer)

