[project]
name = "fenykl"
version = "0.1.0"
description = "Firmware tools, plugin SDK and main plugin for the Olympus PEN E-PL3"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fenykl = "fenykl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["py"]
